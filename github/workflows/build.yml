name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Install legacy Gradle 2.14
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14-bin.zip
          unzip -q gradle-2.14-bin.zip -d $HOME
          echo "$HOME/gradle-2.14/bin" >> $GITHUB_PATH
      - name: Build with Gradle
        working-directory: fakepixelgarden
        run: gradle build --no-daemon
      - name: Upload compiled jar
        uses: actions/upload-artifact@v4
        with:
          name: fakepixelgarden-jar
          path: fakepixelgarden/build/libs/*.jar
